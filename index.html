<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>H.E.R.O. Institute - Enrollment Dashboard</title>
    <style>
      /* --- H.E.R.O Institute Branding Variables --- */
      :root {
        --primary-blue: #0f3a61; 
        --accent-teal: #00a4b4;  
        --brand-green: #6fb327; 
        --light-bg: #f4f7f9;
        --border-color: #d1d9e0;
        --text-dark: #2b3844;
      }

      body { 
        display: flex; 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        margin: 0;
        height: 100vh;
        background-color: var(--light-bg);
      }

      /* --- Phone Widget Container --- */
      #phone-container { 
        width: 320px; 
        height: 100vh;
        border-right: 2px solid var(--border-color);
        background: white;
        box-shadow: 2px 0px 10px rgba(0,0,0,0.05);
        z-index: 10;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      /* --- Right Side: Dashboard & Form --- */
      #dashboard-container { 
        flex-grow: 1; 
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow-y: hidden;
      }

      /* --- The Form Card with Watermark --- */
      #form-card {
        position: relative;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        width: 100%;
        max-width: 450px;
        border-top: 5px solid var(--accent-teal);
        overflow: hidden; 
      }

      #form-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image: url('logo.png'); 
        background-repeat: no-repeat;
        background-position: center;
        background-size: 70%; 
        opacity: 0.08; 
        z-index: 0;
      }

      #form-card > * {
        position: relative;
        z-index: 1;
      }

      .header-text {
        text-align: center;
        margin-bottom: 25px;
      }

      .header-text h2 {
        color: var(--primary-blue);
        margin: 0 0 5px 0;
      }

      .header-text p {
        color: #64748b;
        margin: 0;
        font-size: 14px;
      }

      .input-group { 
        margin-bottom: 18px; 
      }
      
      label {
        display: block;
        font-weight: 600;
        color: var(--text-dark);
        margin-bottom: 6px;
        font-size: 14px;
      }

      input, select, textarea { 
        width: 100%; 
        padding: 10px 12px; 
        border: 1px solid var(--border-color);
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 14px;
        font-family: inherit;
        background: rgba(255, 255, 255, 0.9); 
        transition: border-color 0.2s;
      }

      input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: var(--accent-teal);
        box-shadow: 0 0 0 3px rgba(0, 164, 180, 0.1);
      }

      button { 
        width: 100%;
        margin-top: 10px;
        padding: 14px 20px; 
        background: var(--brand-green); 
        color: white; 
        border: none; 
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer; 
        transition: background 0.2s, transform 0.1s;
      }

      button:hover {
        background: #5a9120; 
      }

      button:active {
        transform: scale(0.98);
      }

      #statusMessage {
        margin-top: 15px;
        text-align: center;
        font-size: 14px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>

    <!-- 1. The RingCentral Embeddable Widget -->
    <div id="phone-container">
      <!-- Make sure your clientId is still inside this URL! -->
    <iframe id="rc-widget" allow="microphone" 
        src="https://apps.ringcentral.com/integration/ringcentral-embeddable/latest/app.html?clientId=3WhRIqL8oGjeZ4YD3dGkCM&appServer=https://platform.ringcentral.com&redirectUri=https://apps.ringcentral.com/integration/ringcentral-embeddable/latest/redirect.html">
</iframe>
    </div>

    <!-- 2. The Dashboard Right Side -->
    <div id="dashboard-container">
      <div id="form-card">
        
        <div class="header-text">
          <h2>Enrollment Logger</h2>
          <p>Record your call outcomes instantly.</p>
        </div>

        <div class="input-group">
          <label>📞 Phone Number (Auto-Fills):</label>
          <input type="text" id="phone" placeholder="(555) 555-5555">
        </div>

        <div class="input-group">
          <label>✉️ Email Address:</label>
          <input type="email" id="email" placeholder="lead@example.com">
        </div>

        <!-- NEW: Program Interest Dropdown -->
        <div class="input-group">
          <label>🎓 Program Interest:</label>
          <select id="program">
            <option disabled selected>Select a program...</option>
            <option>Phlebotomy</option>
            <option>Medical Assisting</option>
            <option>Patient Care Tech</option>
            <option>CNA</option>
            <option>Not Applicable</option>
          </select>
        </div>

        <div class="input-group">
          <label>📋 Call Outcome:</label>
          <select id="disposition">
            <option disabled selected>Select an outcome...</option>
            <option>Left Voicemail</option>
            <option>Spoke to Lead</option>
            <option>No Answer</option>
            <option>Bad Number / Disconnected</option>
            <option>Scheduled Tour</option>
          </select>
        </div>

        <div class="input-group">
          <label>📝 Call Notes (Optional):</label>
          <textarea id="notes" rows="3" placeholder="Lead asked about evening classes..."></textarea>
        </div>
<div class="input-group">
          <label>🔒 Rep PIN:</label>
          <input type="password" id="pin" placeholder="Enter 4-digit PIN" autocomplete="off">
        </div>
        <button onclick="submitLog()" id="submitBtn">Log to ActiveCampaign</button>
        <div id="statusMessage"></div>
      </div>
    </div>

    <!-- 3. The Javascript -->
   <!-- 3. The Javascript -->
    <script>
      const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzBLnUCxcc26yaXUUmnim_pRP188z_emihi5XVcP0nxmek3zXWb6doZMl86OcdfzriQuA/exec";

      // NEW: When the page loads, check if they have a saved PIN!
      document.addEventListener("DOMContentLoaded", function() {
        const savedPin = localStorage.getItem("heroRepPin");
        if (savedPin) {
          document.getElementById('pin').value = savedPin;
        }
      });

      window.addEventListener('message', function(e) {
        const data = e.data;
        if (data && data.type === 'rc-call-ring-notify' || data.type === 'rc-web-phone-call-start') {
          let callerNumber = data.call.from.phoneNumber || data.call.to.phoneNumber;
          document.getElementById('phone').value = callerNumber;
        }
      });

      function submitLog() {
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('statusMessage');
        const phone = document.getElementById('phone').value;
        const email = document.getElementById('email').value;
        const program = document.getElementById('program').value;
        const disp = document.getElementById('disposition').value;
        const pin = document.getElementById('pin').value;
        
        if(!pin) {
            status.innerText = "⚠️ Please enter your Rep PIN.";
            status.style.color = "#d93025";
            return;
        }

        if(!phone || disp === "Select an outcome...") {
            status.innerText = "⚠️ Please ensure a phone number and disposition are selected.";
            status.style.color = "#d93025";
            return;
        }

        // NEW: Save the PIN to local storage so they don't have to type it again tomorrow
        localStorage.setItem("heroRepPin", pin);

        btn.innerText = "Logging...";
        btn.style.opacity = "0.7";
        status.innerText = "";
        
        const formData = {
          pin: pin,
          phone: phone,
          email: email,
          program: program === "Select a program..." ? "" : program, 
          disposition: disp,
          notes: document.getElementById('notes').value
        };

        fetch(GAS_WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify(formData)
        })
        .then(response => response.text())
        .then(result => {
          // If the backend rejects the PIN, warn them!
          if (result.includes("Access Denied")) {
             status.innerText = "❌ " + result;
             status.style.color = "#d93025";
             btn.innerText = "Log to ActiveCampaign";
             btn.style.opacity = "1";
             return;
          }

          status.innerText = "✅ " + result;
          status.style.color = "var(--brand-green)";
          
          // Clear form after success (but leave the PIN alone!)
          document.getElementById('notes').value = ""; 
          document.getElementById('email').value = ""; 
          document.getElementById('disposition').selectedIndex = 0;
          document.getElementById('program').selectedIndex = 0; 
          btn.innerText = "Log to ActiveCampaign";
          btn.style.opacity = "1";
          
          setTimeout(() => { status.innerText = ""; }, 4000);
        })
        .catch(error => {
          status.innerText = "❌ Error: Could not connect to script.";
          status.style.color = "#d93025";
          btn.innerText = "Log to ActiveCampaign";
          btn.style.opacity = "1";
        });
      }
    </script>
  </body>
</html>
